# TH_TempFly Plugin Messages
# Customize all messages using Minecraft color codes with ampersand notation

# Command messages
commands:
  no-permission: "&cYou don't have permission to use this command."
  player-only: "&cThis command can only be used by players."
  player-not-found: "&cPlayer not found: {player}"
  specify-player: "&cPlease specify a player."
  invalid-time: "&cInvalid time format. Use: 30s, 5m, 2h, 1d"

  # /tempfly command
  tempfly:
    usage: "&e/tempfly <give|add|remove|check|reload> [player] [time]"
    time-formats: "&7Time formats: &e30s, 5m, 2h, 1d &7or simply &e30 &7for seconds"
    unknown-subcommand: "&cUnknown subcommand."
    version: "&eTH_TempFly &7v{version}"

    # Subcommands
    reload:
      success: "&aConfiguration reloaded."

    check:
      remaining: "&aRemaining flight time: &e{time}"
      no-time: "&c{player} has no remaining flight time."

    give:
      usage: "&cUsage: /tempfly give <player> <time>"
      example: "&7Example: &e/tempfly give PlayerName 1h"
      success: "&aFlight time set to &e{time}"

    add:
      usage: "&cUsage: /tempfly add <player> <time>"
      example: "&7Example: &e/tempfly add PlayerName 30m"
      success: "&aFlight time updated by &e{change}"

    remove:
      usage: "&cUsage: /tempfly remove <player> <time>"
      example: "&7Example: &e/tempfly remove PlayerName 15m"
      success: "&aFlight time reduced by &e{change}"

    migrate:
      starting: "&7Starting migration from SQLite to MySQL..."
      success: "&aMigration completed successfully! &7Total: &e{total} &7records, &e{migrated} &7migrated, &e{skipped} &7skipped"
      error:
        not-plugin: "&cError: Could not access the plugin"
        not-mysql: "&cError: You must be using MySQL to migrate data. Change storage.type to MYSQL in config.yml"
        no-sqlite: "&cError: SQLite database file not found: {file}"
        no-datasource: "&cError: Could not obtain the MySQL connection"
        general: "&cError during migration: {error}"

    debug:
      usage: "&eUsage: /atempfly debug <true|false>"
      invalid-subcommand: "&cInvalid subcommand. Use: /atempfly debug <true|false>"
      status: "&7Debug mode is currently {status}."
      enabled: "&aDebug mode enabled. Detailed logs will be shown in console."
      disabled: "&cDebug mode disabled."
      invalid-value: "&cInvalid value. Use: true, false, on, off, 1, or 0"

# /fly command
fly:
  no-permission: "&cYou don't have permission to use this command."
  no-time: "&cYou have no remaining flight time."
  contact-admin: "&7Contact an administrator to get flight time."
  disabled: "&cFlight disabled. Remaining time: &e{time}"
  enabled: "&aFlight enabled. Remaining time: &e{time}"
  infinite-enabled: "&aInfinite flight enabled."
  status:
    flying: "&aYour flight is enabled. Remaining time: &e{time}"
    not-flying: "&cYour flight is disabled. Remaining time: &e{time}"
    infinite: "&aYou have infinite flight."
  usage: "&eUsage: /fly [toggle|on|off|check]"

  # Flight restrictions
  restrictions:
    world-blocked: "&cFlight is disabled in this world: &e{world}"
    region-blocked: "&cFlight is disabled in this region: &e{region}"
    entering-blocked-zone: "&cYou have entered a no-fly zone. Flight has been disabled."
    bypass-enabled: "&6&l[BYPASS] &eYou have permission to fly in blocked zones."

# Event messages
events:
  join:
    welcome-back: "&aWelcome back! You have &e{time} &aof remaining flight time."
    welcome-back-frozen: "&aWelcome back! You have &e{time} &aof remaining flight time. &7(Time freezes while you're offline)"
    infinite-fly: "&aWelcome! You have infinite flight."

  quit:
    fly-disabled: "&cFlight disabled upon leaving the server."
    time-frozen: "&7Your flight time has been frozen and will resume when you return."

  time-expired: "&cYour flight time has expired!"

  # Time system messages
  time-system:
    frozen-mode: "&7Time freezes while you're offline - it only counts down while you play!"
    continuous-mode: "&7Time keeps counting down even while you're offline!"

  # Title messages for fly time warnings
  titles:
    warning-title: "&c&lFlight Time Warning!"
    warning-subtitle: "&e{seconds} seconds remaining"
    expired-title: "&4&lFlight Time Expired!"
    expired-subtitle: "&cYour flight has been disabled"

# PlaceholderAPI messages
placeholders:
  no-time: "No time"
  infinite: "Infinite"
  flying: "Flying"
  can-fly: "Can fly"
  no-permission: "No permission"

# Update checker messages
update:
  available: "&e&lNew version available! &7Current: &cv{current} &7→ Latest: &av{latest}"
  download-url: "&7Download: &b{url}"
  up-to-date: "&aTH_TempFly is up to date! &7(v{version})"
  checking: "&7Checking for updates..."
  check-failed: "&cCould not check for updates. Please check manually."

# Configuration messages
config:
  database:
    initializing: "&7Initializing database..."
    initialized: "&aDatabase initialized successfully"
    error: "&cError initializing the database: {error}"

  plugin:
    starting: "&7Starting TH_TempFly plugin..."
    config-loaded: "&aConfiguration loaded successfully"
    commands-registered: "&aCommands registered successfully"
    listeners-registered: "&aListeners registered successfully"
    placeholderapi-registered: "&aPlaceholderAPI expansion registered successfully!"
    placeholderapi-not-found: "&7PlaceholderAPI not found, placeholders will not be available."
    enabled: "&aTH_TempFly plugin enabled successfully!"
    disabled: "&cTH_TempFly plugin disabled."
